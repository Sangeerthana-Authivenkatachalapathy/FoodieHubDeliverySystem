<mat-sidenav-container class="sidenav-container" (window:resize)="onResize()">
  <!-- Sidebar Navigation -->
  <mat-sidenav 
    #sidenav 
    class="sidenav"
    [mode]="isMobile ? 'over' : 'side'"
    [opened]="!isMobile"
    [fixedInViewport]="isMobile">
    
    <!-- Sidebar Header -->
    <div class="sidenav-header">
      <h2 class="logo">FoodieHub Admin</h2>
      <p class="subtitle">Management Dashboard</p>
    </div>

    <!-- Navigation Menu -->
    <mat-nav-list class="nav-list">
      <mat-list-item 
        *ngFor="let item of menuItems"
        class="sidenav-item"
        [class.active]="isActive(item.route)"
        (click)="navigateTo(item.route)">
        
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        <span matListItemTitle>{{ item.title }}</span>
        
        <!-- Badge for notifications -->
        <span matListItemMeta *ngIf="item.badge" 
              class="notification-badge"
              [matBadge]="item.badge" 
              matBadgeColor="warn"
              matBadgeSize="small">
        </span>
      </mat-list-item>
    </mat-nav-list>

    <!-- User Profile Section -->
    <div class="user-profile" *ngIf="currentUser">
      <mat-divider></mat-divider>
      <div class="user-info">
        <mat-icon class="user-avatar">account_circle</mat-icon>
        <div class="user-details">
          <p class="user-name">{{ currentUser.name }}</p>
          <p class="user-email">{{ currentUser.email }}</p>
        </div>
      </div>
    </div>
  </mat-sidenav>

  <!-- Main Content Area -->
  <mat-sidenav-content class="main-content">
    <!-- Top Toolbar -->
    <mat-toolbar class="toolbar" color="primary">
      <!-- Menu Button for Mobile -->
      <button 
        mat-icon-button 
        *ngIf="isMobile"
        (click)="toggleSidenav()"
        class="menu-button">
        <mat-icon>menu</mat-icon>
      </button>

      <!-- Page Title -->
      <span class="toolbar-title">Admin Dashboard</span>

      <!-- Spacer -->
      <span class="toolbar-spacer"></span>

      <!-- Notification Bell -->
      <button mat-icon-button class="notification-btn">
        <mat-icon [matBadge]="5" matBadgeColor="warn" matBadgeSize="small">
          notifications
        </mat-icon>
      </button>

      <!-- User Menu -->
      <button mat-icon-button [matMenuTriggerFor]="userMenu" class="user-menu-btn">
        <mat-icon>account_circle</mat-icon>
      </button>
      
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item disabled>
          <mat-icon>person</mat-icon>
          <span>{{ currentUser?.name }}</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item>
          <mat-icon>settings</mat-icon>
          <span>Settings</span>
        </button>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <!-- Router Outlet for Page Content -->
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
