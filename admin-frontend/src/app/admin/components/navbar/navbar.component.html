<mat-toolbar color="primary" class="navbar">
  <mat-toolbar-row>
    <!-- Menu toggle button -->
    <button mat-icon-button (click)="onToggleSidebar()" class="menu-button">
      <mat-icon>menu</mat-icon>
    </button>

    <!-- App title -->
    <span class="app-title">FoodieHub Admin</span>

    <!-- Spacer -->
    <span class="spacer"></span>

    <!-- Notifications -->
    <button mat-icon-button (click)="onNotificationsClick()" class="notification-button">
      <mat-icon [matBadge]="notificationCount" [matBadgeHidden]="notificationCount === 0" matBadgeColor="warn">
        notifications
      </mat-icon>
    </button>

    <!-- User profile menu -->
    <button mat-button [matMenuTriggerFor]="userMenu" class="user-button">
      <mat-icon>account_circle</mat-icon>
      <span class="user-name">{{ currentUser?.firstName || 'Admin' }}</span>
      <mat-icon>arrow_drop_down</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu">
      <button mat-menu-item (click)="onProfileClick()">
        <mat-icon>person</mat-icon>
        <span>Profile</span>
      </button>
      <button mat-menu-item (click)="onLogout()">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </mat-menu>
  </mat-toolbar-row>
</mat-toolbar>
