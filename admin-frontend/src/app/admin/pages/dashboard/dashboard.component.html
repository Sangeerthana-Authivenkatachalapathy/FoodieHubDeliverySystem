<div class="dashboard-container">
  <!-- Page header -->
  <div class="page-header">
    <h1 class="page-title">Dashboard</h1>
    <p class="page-subtitle">Welcome to FoodieHub Admin Panel</p>
  </div>

  <!-- Loading spinner -->
  <div *ngIf="isLoading" class="loading-container">
    <mat-spinner></mat-spinner>
  </div>

  <!-- Dashboard content -->
  <div *ngIf="!isLoading && dashboardSummary" class="dashboard-content">
    
    <!-- Stats cards grid -->
    <div class="stats-grid">
      <app-stats-card 
        *ngFor="let card of getStatsCards()"
        [title]="card.title"
        [value]="card.value"
        [icon]="card.icon"
        [color]="card.color"
        [subtitle]="card.subtitle"
        [trend]="card.trend"
        [clickable]="card.clickable">
      </app-stats-card>
    </div>

    <!-- Quick actions -->
    <div class="quick-actions-section">
      <mat-card class="quick-actions-card">
        <mat-card-header>
          <mat-card-title>Quick Actions</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <div class="action-buttons">
            <button mat-raised-button color="primary" [routerLink]="['/admin/orders']">
              <mat-icon>receipt_long</mat-icon>
              View Orders
            </button>
            <button mat-raised-button color="accent" [routerLink]="['/admin/restaurants']">
              <mat-icon>restaurant</mat-icon>
              Manage Restaurants
            </button>
            <button mat-raised-button color="warn" [routerLink]="['/admin/delivery-partners']">
              <mat-icon>delivery_dining</mat-icon>
              Delivery Partners
            </button>
            <button mat-raised-button [routerLink]="['/admin/feedback']">
              <mat-icon>feedback</mat-icon>
              Customer Feedback
            </button>
          </div>
        </mat-card-content>
      </mat-card>
    </div>

    <!-- Recent activity or charts can be added here -->
    <div class="charts-section">
      <mat-card class="charts-card">
        <mat-card-header>
          <mat-card-title>Recent Activity</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <p>Charts and recent activity will be displayed here</p>
          <!-- Add charts components here -->
        </mat-card-content>
      </mat-card>
    </div>

  </div>
</div>
